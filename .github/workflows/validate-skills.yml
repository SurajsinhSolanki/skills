name: Validate skills
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install official validator
        run: python -m pip install -r requirements-dev.txt
      - name: Validate every skill and local references
        run: python scripts/validate_skills.py
      - name: Check generated catalog
        run: python scripts/update_catalog.py --check
      - name: Test collection checks
        run: python -m unittest discover -s tests -v
      - name: Test existing review evaluations
        run: python -m unittest discover -s skills/pr-review/evals -p 'test_*.py' -v
      - name: Build and verify review fixtures
        run: python skills/pr-review/evals/run.py
      - name: Build and verify workflow fixtures (no model calls)
        run: python evals/workflow-skills/run.py
